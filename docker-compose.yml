services:
  postgres:
    image: postgres:17.10-alpine
    container_name: nlserver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NETHERLINK_POSTGRES_DB:-netherlink}
      POSTGRES_USER: ${NETHERLINK_POSTGRES_USER:-netherlink_app}
      POSTGRES_PASSWORD: ${NETHERLINK_POSTGRES_PASSWORD:?Set NETHERLINK_POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "${NETHERLINK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - nlserver-postgres-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.6.3-alpine
    container_name: nlserver-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${NETHERLINK_REDIS_PORT:-6379}:6379"
    volumes:
      - nlserver-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: nlserver-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NETHERLINK_OBJECT_STORAGE_ACCESS_KEY:?Set NETHERLINK_OBJECT_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${NETHERLINK_OBJECT_STORAGE_SECRET_KEY:?Set NETHERLINK_OBJECT_STORAGE_SECRET_KEY in .env}
      TZ: Asia/Shanghai
    ports:
      - "${NETHERLINK_MINIO_API_PORT:-9000}:9000"
      - "${NETHERLINK_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - nlserver-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: nlserver-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${NETHERLINK_OBJECT_STORAGE_ACCESS_KEY:?Set NETHERLINK_OBJECT_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${NETHERLINK_OBJECT_STORAGE_SECRET_KEY:?Set NETHERLINK_OBJECT_STORAGE_SECRET_KEY in .env}
      MINIO_INTERNAL_ENDPOINT: ${NETHERLINK_OBJECT_STORAGE_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_BUCKET: ${NETHERLINK_OBJECT_STORAGE_PUBLIC_BUCKET:-netherlink-public}
      MINIO_PROTECTED_BUCKET: ${NETHERLINK_OBJECT_STORAGE_PROTECTED_BUCKET:-netherlink-protected}
      MINIO_PRIVATE_BUCKET: ${NETHERLINK_OBJECT_STORAGE_PRIVATE_BUCKET:-netherlink-private}
      MINIO_TMP_BUCKET: ${NETHERLINK_OBJECT_STORAGE_TMP_BUCKET:-netherlink-tmp}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]

volumes:
  nlserver-postgres-data:
  nlserver-redis-data:
  nlserver-minio-data:
